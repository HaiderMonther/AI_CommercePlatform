# Upgrade only real WebSocket requests; everything else keeps the upstream connection
# alive instead of closing it after each API call.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Bodies are JSON; nothing in the dashboard uploads large files.
  client_max_body_size 2m;

  # gzip on text assets; images and fonts are already compressed.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers for every response. nginx drops server-level add_header in any
  # location that declares its own, so no location below uses add_header; caching is
  # set with `expires`, which does not count.
  #
  # CSP: the bundle and its styles are same-origin; Vuetify injects its theme as an inline
  # style; the Cairo font comes from Google Fonts; product images can come from any HTTPS
  # host (merchant URLs, Meta's CDN). If the API is served from another origin
  # (VITE_API_BASE_URL), add it to connect-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # TLS ends at the load balancer in front of this container; enable HSTS there (or here,
  # once this server is only ever reached over HTTPS):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
  }

  # index.html must never be cached, or users keep loading a stale bundle after a deploy.
  location = /index.html {
    expires -1;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade for the realtime gateway.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
